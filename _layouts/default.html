<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {% include head.html %}
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <div class="container header-inner">
          <div class="header-brand">
            <a class="site-title" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}">
              <img class="site-logo" src="{{ '/assets/logo.png' | relative_url }}" alt="Logo de {{ site.title }}" width="699" height="99" decoding="async" />
              <span class="site-title-text">
                <span class="site-name">{{ site.title }}</span>
                <span class="site-tagline">{{ site.description }}</span>
              </span>
            </a>

            <button class="nav-toggle" type="button" aria-label="Abrir menú" aria-controls="site-nav" aria-expanded="false">
              <svg class="nav-toggle__icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
                <path fill="currentColor" d="M4 6.5h16a1 1 0 0 0 0-2H4a1 1 0 0 0 0 2Zm16 5H4a1 1 0 0 0 0 2h16a1 1 0 0 0 0-2Zm0 7H4a1 1 0 0 0 0 2h16a1 1 0 0 0 0-2Z"/>
              </svg>
              <span class="nav-toggle__text">Menú</span>
            </button>
          </div>

          <nav class="site-nav" id="site-nav">
            <a href="{{ '/podcast/' | relative_url }}">Podcast</a>
            <a href="{{ '/about/' | relative_url }}">Acerca de</a>
            <a href="{{ '/enlaces/' | relative_url }}">Enlaces</a>
            <a href="{{ '/lista-correo/' | relative_url }}">Lista de correo</a>
          </nav>
        </div>
      </header>

      <main class="container main-content">
        {{ content }}
      </main>

      <footer class="site-footer">
        <div class="container">
          <p>© {{ site.time | date: "%Y" }} {{ site.title }}.</p>
          <p class="footer-mantra">Cada día es un buen día</p>
          <nav class="footer-links">
            <a href="{{ '/archive/' | relative_url }}">Archivo</a>
            <a href="{{ '/categorias/' | relative_url }}">Categorías</a>
            <a href="{{ '/tags/' | relative_url }}">Etiquetas</a>
          </nav>
        </div>
      </footer>
    </div>

    <aside class="global-audio-dock" data-global-audio-dock hidden aria-label="Mini reproductor">
      <div class="global-audio-dock__text">
        <strong class="global-audio-dock__title" data-global-audio-title>Sin audio</strong>
        <span class="global-audio-dock__meta" data-global-audio-meta></span>
      </div>
      <div class="global-audio-dock__actions">
        <button type="button" data-global-audio-action="play-pause">Reproducir</button>
        <a href="#" data-global-audio-link>Ir al episodio</a>
        <button type="button" data-global-audio-action="close" aria-label="Cerrar mini reproductor">Cerrar</button>
      </div>
      <audio data-global-audio-el preload="metadata" playsinline></audio>
    </aside>

    <script>
      (function () {
        var button = document.querySelector('.nav-toggle');
        var nav = document.getElementById('site-nav');

        if (!button || !nav) return;

        function setOpen(isOpen) {
          nav.classList.toggle('is-open', isOpen);
          button.setAttribute('aria-expanded', String(isOpen));
          button.setAttribute('aria-label', isOpen ? 'Cerrar menú' : 'Abrir menú');
        }

        button.addEventListener('click', function () {
          setOpen(!nav.classList.contains('is-open'));
        });

        nav.addEventListener('click', function (event) {
          var link = event.target && event.target.closest ? event.target.closest('a') : null;
          if (link) setOpen(false);
        });

        document.addEventListener('click', function (event) {
          if (!nav.classList.contains('is-open')) return;
          var insideHeader = event.target && event.target.closest ? event.target.closest('.site-header') : null;
          if (!insideHeader) setOpen(false);
        });

        window.addEventListener('resize', function () {
          if (window.matchMedia && window.matchMedia('(min-width: 721px)').matches) {
            setOpen(false);
          }
        });
      })();
    </script>

    <script>
      (function () {
        var STORAGE_KEY = 'site-global-audio-state-v1';
        var DISMISSED_KEY = 'site-global-audio-dismissed-v1';
        var SESSION_STARTED_KEY = 'site-global-audio-started-session-v1';
        var dock = document.querySelector('[data-global-audio-dock]');
        if (!dock) return;

        var dockAudio = dock.querySelector('[data-global-audio-el]');
        var titleEl = dock.querySelector('[data-global-audio-title]');
        var metaEl = dock.querySelector('[data-global-audio-meta]');
        var playPauseBtn = dock.querySelector('[data-global-audio-action="play-pause"]');
        var closeBtn = dock.querySelector('[data-global-audio-action="close"]');
        var episodeLink = dock.querySelector('[data-global-audio-link]');
        var inlineAudio = document.querySelector('[data-post-audio]');
        var inlineTitleEl = document.querySelector('.post-title');
        var lastTimeSave = 0;
        var state = null;
        var dismissedUntilPlay = false;
        var sessionStarted = false;

        function resolveUrl(url) {
          if (!url) return '';
          try {
            return new URL(url, window.location.href).toString();
          } catch (error) {
            return '';
          }
        }

        function getAudioSrc(audioEl) {
          if (!audioEl) return '';
          var sourceEl = audioEl.querySelector('source');
          return resolveUrl(audioEl.currentSrc || audioEl.getAttribute('src') || (sourceEl ? sourceEl.getAttribute('src') : ''));
        }

        function getInlineTitle() {
          if (inlineTitleEl && inlineTitleEl.textContent) {
            return inlineTitleEl.textContent.trim();
          }
          return document.title;
        }

        function loadState() {
          try {
            var raw = window.localStorage.getItem(STORAGE_KEY);
            if (!raw) return null;
            var parsed = JSON.parse(raw);
            if (!parsed || typeof parsed.src !== 'string' || parsed.src === '') return null;
            parsed.hasStarted = parsed.hasStarted === true || parsed.isPlaying === true || (Number.isFinite(parsed.currentTime) && parsed.currentTime > 0);
            return parsed;
          } catch (error) {
            return null;
          }
        }

        function saveState(nextState) {
          state = nextState;
          try {
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          } catch (error) {
            // Ignore storage errors.
          }
        }

        function clearState() {
          state = null;
          try {
            window.localStorage.removeItem(STORAGE_KEY);
          } catch (error) {
            // Ignore storage errors.
          }
        }

        function loadDismissedFlag() {
          try {
            return window.sessionStorage.getItem(DISMISSED_KEY) === 'true';
          } catch (error) {
            return false;
          }
        }

        function setDismissedFlag(value) {
          dismissedUntilPlay = value === true;
          try {
            if (dismissedUntilPlay) {
              window.sessionStorage.setItem(DISMISSED_KEY, 'true');
            } else {
              window.sessionStorage.removeItem(DISMISSED_KEY);
            }
          } catch (error) {
            // Ignore storage errors.
          }
        }

        function loadSessionStartedFlag() {
          try {
            return window.sessionStorage.getItem(SESSION_STARTED_KEY) === 'true';
          } catch (error) {
            return false;
          }
        }

        function setSessionStartedFlag(value) {
          sessionStarted = value === true;
          try {
            if (sessionStarted) {
              window.sessionStorage.setItem(SESSION_STARTED_KEY, 'true');
            } else {
              window.sessionStorage.removeItem(SESSION_STARTED_KEY);
            }
          } catch (error) {
            // Ignore storage errors.
          }
        }

        function formatSeconds(seconds) {
          if (!Number.isFinite(seconds) || seconds < 0) {
            return '0:00';
          }
          var total = Math.floor(seconds);
          var mins = Math.floor(total / 60);
          var secs = total % 60;
          return mins + ':' + String(secs).padStart(2, '0');
        }

        function getActiveAudio() {
          if (inlineAudio && state && state.src && state.src === getAudioSrc(inlineAudio)) {
            return inlineAudio;
          }
          return dockAudio;
        }

        function renderDock() {
          var visible = !!(state && state.src && state.hasStarted && !dismissedUntilPlay && sessionStarted);
          dock.hidden = !visible;
          document.body.classList.toggle('has-global-audio-dock', visible);
          if (!visible) {
            return;
          }

          titleEl.textContent = state.title || 'Audio';
          episodeLink.href = state.pageUrl || window.location.href;
          playPauseBtn.textContent = state.isPlaying ? 'Pausar' : 'Reproducir';
          metaEl.textContent = (state.isPlaying ? 'En reproducción' : 'En pausa') + ' · ' + formatSeconds(state.currentTime || 0);
        }

        function applyStateToDockAudio(shouldSeek) {
          if (!state || !state.src) return;
          if (dockAudio.src !== state.src) {
            dockAudio.src = state.src;
          }
          if (Number.isFinite(state.playbackRate) && state.playbackRate > 0) {
            dockAudio.playbackRate = state.playbackRate;
          }
          if (!shouldSeek || !Number.isFinite(state.currentTime) || state.currentTime <= 0) {
            return;
          }
          var applySeek = function () {
            try {
              if (Number.isFinite(dockAudio.duration) && state.currentTime >= dockAudio.duration) return;
              dockAudio.currentTime = state.currentTime;
            } catch (error) {
              // Ignore seek errors.
            }
          };
          if (dockAudio.readyState >= 1) {
            applySeek();
          } else {
            dockAudio.addEventListener('loadedmetadata', applySeek, { once: true });
          }
        }

        function persistFromAudio(audioEl, baseTitle, baseUrl, forcePlaying) {
          var src = getAudioSrc(audioEl);
          if (!src) return;
          var playing = typeof forcePlaying === 'boolean' ? forcePlaying : (!audioEl.paused && !audioEl.ended);
          if (playing) {
            setSessionStartedFlag(true);
            setDismissedFlag(false);
          } else if (dismissedUntilPlay) {
            return;
          }
          var hasStarted = playing || (state && state.src === src && state.hasStarted === true) || (Number.isFinite(audioEl.currentTime) && audioEl.currentTime > 0);
          saveState({
            src: src,
            title: baseTitle || (state ? state.title : '') || document.title,
            pageUrl: baseUrl || (state ? state.pageUrl : '') || window.location.href,
            currentTime: Number.isFinite(audioEl.currentTime) ? audioEl.currentTime : 0,
            playbackRate: Number.isFinite(audioEl.playbackRate) ? audioEl.playbackRate : 1,
            isPlaying: playing,
            hasStarted: hasStarted,
            updatedAt: Date.now()
          });
          renderDock();
        }

        function bindAudioEvents(audioEl, baseTitle, baseUrl) {
          if (!audioEl) return;
          audioEl.addEventListener('play', function () {
            persistFromAudio(audioEl, baseTitle, baseUrl, true);
          });
          audioEl.addEventListener('pause', function () {
            persistFromAudio(audioEl, baseTitle, baseUrl, false);
          });
          audioEl.addEventListener('ratechange', function () {
            persistFromAudio(audioEl, baseTitle, baseUrl);
          });
          audioEl.addEventListener('ended', function () {
            persistFromAudio(audioEl, baseTitle, baseUrl, false);
          });
          audioEl.addEventListener('timeupdate', function () {
            if (Date.now() - lastTimeSave < 900) return;
            lastTimeSave = Date.now();
            persistFromAudio(audioEl, baseTitle, baseUrl);
          });
        }

        state = loadState();
        dismissedUntilPlay = loadDismissedFlag();
        sessionStarted = loadSessionStartedFlag();
        var inlineSrc = getAudioSrc(inlineAudio);
        var inlineTitle = getInlineTitle();
        var inlineUrl = window.location.href;

        bindAudioEvents(dockAudio, state && state.title ? state.title : document.title, state && state.pageUrl ? state.pageUrl : window.location.href);
        bindAudioEvents(inlineAudio, inlineTitle, inlineUrl);

        if (state && inlineAudio && state.src === inlineSrc) {
          if (Number.isFinite(state.playbackRate) && state.playbackRate > 0) {
            inlineAudio.playbackRate = state.playbackRate;
          }
          if (Number.isFinite(state.currentTime) && state.currentTime > 0) {
            var restoreInlineTime = function () {
              try {
                if (Number.isFinite(inlineAudio.duration) && state.currentTime >= inlineAudio.duration) return;
                inlineAudio.currentTime = state.currentTime;
              } catch (error) {
                // Ignore seek errors.
              }
            };
            if (inlineAudio.readyState >= 1) {
              restoreInlineTime();
            } else {
              inlineAudio.addEventListener('loadedmetadata', restoreInlineTime, { once: true });
            }
          }
        } else if (state && state.src) {
          applyStateToDockAudio(true);
          if (state.isPlaying && sessionStarted) {
            dockAudio.play().catch(function () {
              // Autoplay can be blocked; keep paused state visible.
              state.isPlaying = false;
              renderDock();
            });
          }
        }

        playPauseBtn.addEventListener('click', function () {
          if (!state || !state.src) return;
          var activeAudio = getActiveAudio();
          if (activeAudio === dockAudio) {
            applyStateToDockAudio(true);
          }
          if (activeAudio.paused || activeAudio.ended) {
            activeAudio.play().catch(function () {
              renderDock();
            });
          } else {
            activeAudio.pause();
          }
        });

        closeBtn.addEventListener('click', function () {
          if (inlineAudio && !inlineAudio.paused) {
            inlineAudio.pause();
          }
          if (!dockAudio.paused) {
            dockAudio.pause();
          }
          dockAudio.removeAttribute('src');
          dockAudio.load();
          setDismissedFlag(true);
          setSessionStartedFlag(false);
          clearState();
          renderDock();
        });

        renderDock();
      })();
    </script>
  </body>
</html>
