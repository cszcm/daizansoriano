<div class="post-audio-player" data-post-audio-player>
  <p class="post-audio-status" data-post-audio-status role="status" aria-live="polite">Audio disponible.</p>
  <div class="post-audio-controls">
    <label for="post-audio-rate-{{ page.url | slugify }}">Velocidad</label>
    <select id="post-audio-rate-{{ page.url | slugify }}" data-post-audio-rate>
      <option value="0.75">0.75x</option>
      <option value="1" selected>1x</option>
      <option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option>
      <option value="1.75">1.75x</option>
      <option value="2">2x</option>
    </select>
  </div>
  <audio controls preload="metadata" data-post-audio controlsList="nodownload" playsinline>
    <source src="{{ include.audio_url | relative_url }}" type="audio/mpeg">
    Tu navegador no soporta el reproductor de audio.
  </audio>
  <p class="post-audio-download">
    <a href="{{ include.audio_url | relative_url }}" download>Descargar audio MP3</a>
  </p>
  <p class="post-audio-share">
    <button type="button" data-post-audio-share>Compartir momento</button>
  </p>
</div>

<style>
  .post-audio-player {
    margin: 1rem 0 1.5rem;
    padding: 0.75rem 1rem;
    border: 1px solid rgba(0, 0, 0, 0.15);
    border-radius: 0.5rem;
    background: rgba(0, 0, 0, 0.02);
  }

  .post-audio-status {
    margin: 0 0 0.5rem;
    font-size: 0.95rem;
  }

  .post-audio-player audio {
    width: 100%;
    max-width: 36rem;
  }

  .post-audio-controls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0 0 0.5rem;
  }

  .post-audio-controls label,
  .post-audio-controls select {
    font-size: 0.92rem;
  }

  .post-audio-download {
    margin: 0.5rem 0 0;
    font-size: 0.92rem;
  }

  .post-audio-download a {
    text-decoration: underline;
  }

  .post-audio-share {
    margin: 0.5rem 0 0;
  }

  .post-audio-share button {
    font-size: 0.92rem;
  }
</style>

<script>
  (function () {
    function initPostAudioPlayer() {
      var root = document.querySelector('[data-post-audio-player]');
      if (!root) {
        return;
      }

      var audio = root.querySelector('[data-post-audio]');
      var status = root.querySelector('[data-post-audio-status]');
      var rateSelect = root.querySelector('[data-post-audio-rate]');
      var shareBtn = root.querySelector('[data-post-audio-share]');
      if (!audio || !status) {
        return;
      }
      var storageKey = 'post-audio-position:' + '{{ page.url | slugify }}';
      var rateStorageKey = 'post-audio-rate';
      var restored = false;

      function setStatus(message) {
        status.textContent = message;
      }

      function savePosition() {
        if (!window.localStorage || !Number.isFinite(audio.currentTime)) {
          return;
        }
        try {
          window.localStorage.setItem(storageKey, String(audio.currentTime));
        } catch (error) {
          // Ignore quota/private mode errors.
        }
      }

      function clearSavedPosition() {
        if (!window.localStorage) {
          return;
        }
        try {
          window.localStorage.removeItem(storageKey);
        } catch (error) {
          // Ignore storage errors.
        }
      }

      function restorePosition() {
        if (!window.localStorage || restored) {
          return;
        }
        restored = true;
        try {
          var raw = window.localStorage.getItem(storageKey);
          if (!raw) {
            return;
          }
          var seconds = parseFloat(raw);
          if (!Number.isFinite(seconds) || seconds <= 0) {
            return;
          }
          if (!Number.isFinite(audio.duration) || seconds >= audio.duration - 1) {
            clearSavedPosition();
            return;
          }
          audio.currentTime = seconds;
          setStatus('Audio listo. Retoma desde donde lo dejaste.');
        } catch (error) {
          // Ignore storage/seek errors.
        }
      }

      function getShareUrl() {
        var url = new URL(window.location.href);
        var currentSeconds = Math.max(0, Math.floor(audio.currentTime || 0));
        url.searchParams.set('t', String(currentSeconds));
        return url.toString();
      }

      function applyTimestampFromUrl() {
        try {
          var url = new URL(window.location.href);
          var raw = url.searchParams.get('t');
          if (!raw) {
            return;
          }
          var seconds = parseInt(raw, 10);
          if (!Number.isFinite(seconds) || seconds < 0) {
            return;
          }
          if (Number.isFinite(audio.duration) && seconds >= audio.duration) {
            return;
          }
          audio.currentTime = seconds;
          setStatus('Audio listo en ' + seconds + 's desde enlace compartido.');
        } catch (error) {
          // Ignore URL/seek errors.
        }
      }

      function applyPlaybackRate(rawRate) {
        var rate = parseFloat(rawRate);
        if (!Number.isFinite(rate) || rate <= 0) {
          rate = 1;
        }
        audio.playbackRate = rate;
        if (typeof audio.defaultPlaybackRate === 'number') {
          audio.defaultPlaybackRate = rate;
        }
        if ('preservesPitch' in audio) {
          audio.preservesPitch = true;
        }
        if ('mozPreservesPitch' in audio) {
          audio.mozPreservesPitch = true;
        }
        if ('webkitPreservesPitch' in audio) {
          audio.webkitPreservesPitch = true;
        }
        return rate;
      }

      function restoreRate() {
        if (!rateSelect || !window.localStorage) {
          applyPlaybackRate(rateSelect ? rateSelect.value : 1);
          return;
        }
        try {
          var savedRate = window.localStorage.getItem(rateStorageKey);
          if (!savedRate) {
            applyPlaybackRate(rateSelect.value);
            return;
          }
          var matchingOption = rateSelect.querySelector('option[value="' + savedRate + '"]');
          if (matchingOption) {
            rateSelect.value = savedRate;
          }
          applyPlaybackRate(rateSelect.value);
        } catch (error) {
          applyPlaybackRate(rateSelect.value);
        }
      }

      audio.addEventListener('play', function () {
        setStatus('Reproduciendo audio del artículo.');
      });

      audio.addEventListener('pause', function () {
        savePosition();
        if (!audio.ended) {
          setStatus('Audio en pausa.');
        }
      });

      audio.addEventListener('ended', function () {
        clearSavedPosition();
        setStatus('Audio finalizado.');
      });

      audio.addEventListener('timeupdate', savePosition);
      audio.addEventListener('loadedmetadata', restorePosition);
      audio.addEventListener('loadedmetadata', applyTimestampFromUrl);
      window.addEventListener('beforeunload', savePosition);

      if (rateSelect) {
        rateSelect.addEventListener('change', function () {
          var rate = applyPlaybackRate(rateSelect.value);
          if (window.localStorage) {
            try {
              window.localStorage.setItem(rateStorageKey, String(rate));
            } catch (error) {
              // Ignore storage errors.
            }
          }
          setStatus('Velocidad: ' + rate + 'x.');
        });
      }

      restoreRate();

      if (shareBtn) {
        shareBtn.addEventListener('click', async function () {
          var shareUrl = getShareUrl();
          try {
            if (navigator.share) {
              await navigator.share({
                title: document.title,
                text: 'Escucha este momento',
                url: shareUrl
              });
              setStatus('Enlace compartido con timestamp.');
              return;
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(shareUrl);
              setStatus('Enlace copiado con timestamp.');
              return;
            }

            setStatus('No se pudo compartir automáticamente. Copia esta URL: ' + shareUrl);
          } catch (error) {
            if (error && error.name === 'AbortError') {
              return;
            }
            setStatus('No se pudo compartir. Copia esta URL: ' + shareUrl);
          }
        });
      }

      audio.play().then(function () {
        setStatus('Reproduciendo audio del artículo.');
      }).catch(function () {
        setStatus('Audio listo. Pulsa reproducir para iniciar.');
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPostAudioPlayer);
      return;
    }

    initPostAudioPlayer();
  })();
</script>
