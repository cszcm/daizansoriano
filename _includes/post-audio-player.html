<div
  class="post-audio-player"
  data-post-audio-player
  data-post-audio-next-url="{% if include.next_url %}{{ include.next_url | relative_url }}{% endif %}"
  data-post-audio-next-title="{% if include.next_title %}{{ include.next_title | escape }}{% endif %}"
>
  <p class="post-audio-status" data-post-audio-status role="status" aria-live="polite">Audio disponible.</p>
  <audio controls preload="metadata" data-post-audio controlsList="nodownload" playsinline>
    <source src="{{ include.audio_url | relative_url }}" type="audio/mpeg">
    Tu navegador no soporta el reproductor de audio.
  </audio>
  <div class="post-audio-toolbar">
    <div class="post-audio-controls">
      <label for="post-audio-rate-{{ page.url | slugify }}">Velocidad</label>
      <select id="post-audio-rate-{{ page.url | slugify }}" data-post-audio-rate>
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="1.75">1.75x</option>
        <option value="2">2x</option>
      </select>
    </div>
    <div class="post-audio-actions">
      <button type="button" class="post-audio-icon-button" data-post-audio-share aria-label="Compartir momento">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M18 16a3 3 0 0 0-2.39 1.19l-6.64-3.32a3.14 3.14 0 0 0 0-1.74l6.64-3.32A3 3 0 1 0 15 7a3.14 3.14 0 0 0 .05.54l-6.64 3.32a3 3 0 1 0 0 2.28l6.64 3.32A3.14 3.14 0 0 0 15 17a3 3 0 1 0 3-1z"></path>
        </svg>
      </button>
      <a class="post-audio-icon-button" href="{{ include.audio_url | relative_url }}" download aria-label="Descargar audio MP3">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M5 20h14v-2H5zm7-18v10.17l3.59-3.58L17 10l-5 5-5-5 1.41-1.41L11 12.17V2z"></path>
        </svg>
      </a>
    </div>
  </div>
  <p class="post-audio-continuous">
    <label for="post-audio-continuous-{{ page.url | slugify }}">
      <input id="post-audio-continuous-{{ page.url | slugify }}" type="checkbox" data-post-audio-continuous>
      Activar reproducción continua
    </label>
  </p>
</div>

<style>
  .post-audio-player {
    margin: 1rem 0 1.5rem;
    padding: 0.75rem 1rem;
    border: 1px solid rgba(0, 0, 0, 0.15);
    border-radius: 0.5rem;
    background: rgba(0, 0, 0, 0.02);
  }

  .post-audio-status {
    margin: 0 0 0.5rem;
    font-size: 0.95rem;
  }

  .post-audio-player audio {
    width: 100%;
    max-width: 36rem;
  }

  .post-audio-controls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .post-audio-toolbar {
    margin: 0.55rem 0 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.9rem;
    flex-wrap: wrap;
  }

  .post-audio-controls label,
  .post-audio-controls select {
    font-size: 0.92rem;
  }

  .post-audio-actions {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }

  .post-audio-icon-button {
    width: 2rem;
    height: 2rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(0, 0, 0, 0.2);
    border-radius: 999px;
    color: inherit;
    background: rgba(0, 0, 0, 0.03);
    cursor: pointer;
    text-decoration: none;
    padding: 0;
    transition: background 120ms ease, border-color 120ms ease;
  }

  .post-audio-icon-button:hover {
    background: rgba(0, 0, 0, 0.06);
    border-color: rgba(0, 0, 0, 0.3);
  }

  .post-audio-continuous {
    margin: 0.5rem 0 0;
    font-size: 0.92rem;
  }

  .post-audio-continuous label {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    cursor: pointer;
  }
</style>

<script>
  (function () {
    function initPostAudioPlayer() {
      var root = document.querySelector('[data-post-audio-player]');
      if (!root) {
        return;
      }

      var audio = root.querySelector('[data-post-audio]');
      var status = root.querySelector('[data-post-audio-status]');
      var rateSelect = root.querySelector('[data-post-audio-rate]');
      var shareBtn = root.querySelector('[data-post-audio-share]');
      var continuousToggle = root.querySelector('[data-post-audio-continuous]');
      if (!audio || !status) {
        return;
      }
      var storageKey = 'post-audio-position:' + '{{ page.url | slugify }}';
      var rateStorageKey = 'post-audio-rate';
      var continuousStorageKey = 'post-audio-continuous-autoplay';
      var autoplayNextStorageKey = 'post-audio-next-autoplay';
      var nextEpisodeUrl = root.getAttribute('data-post-audio-next-url') || '';
      var nextEpisodeTitle = root.getAttribute('data-post-audio-next-title') || '';
      var restored = false;

      function setStatus(message) {
        status.textContent = message;
      }

      function normalizePath(urlLike) {
        try {
          var parsed = new URL(urlLike, window.location.origin);
          var path = parsed.pathname || '/';
          if (path.length > 1) {
            path = path.replace(/\/+$/, '');
          }
          return path;
        } catch (error) {
          return '';
        }
      }

      function rememberNextAutoplayIntent() {
        if (!window.localStorage || !nextEpisodeUrl) {
          return;
        }
        try {
          window.localStorage.setItem(
            autoplayNextStorageKey,
            JSON.stringify({
              path: normalizePath(nextEpisodeUrl),
              createdAt: Date.now()
            })
          );
        } catch (error) {
          // Ignore storage errors.
        }
      }

      function consumeAutoplayIntentForCurrentPage() {
        if (!window.localStorage) {
          return false;
        }
        try {
          var raw = window.localStorage.getItem(autoplayNextStorageKey);
          if (!raw) {
            return false;
          }
          window.localStorage.removeItem(autoplayNextStorageKey);
          var parsed = JSON.parse(raw);
          if (!parsed || !parsed.path || !parsed.createdAt) {
            return false;
          }
          if (Date.now() - Number(parsed.createdAt) > 5 * 60 * 1000) {
            return false;
          }
          return normalizePath(window.location.href) === normalizePath(parsed.path);
        } catch (error) {
          return false;
        }
      }

      function tryAutoplayAfterNavigation() {
        var playPromise;
        try {
          playPromise = audio.play();
        } catch (error) {
          setStatus('Siguiente audio cargado. Pulsa reproducir para continuar.');
          return;
        }
        if (playPromise && typeof playPromise.then === 'function') {
          playPromise
            .then(function () {
              setStatus('Reproducción continua: sonando el siguiente audio.');
            })
            .catch(function () {
              setStatus('Siguiente audio cargado. Pulsa reproducir para continuar.');
            });
        }
      }

      function savePosition() {
        if (!window.localStorage || !Number.isFinite(audio.currentTime)) {
          return;
        }
        try {
          window.localStorage.setItem(storageKey, String(audio.currentTime));
        } catch (error) {
          // Ignore quota/private mode errors.
        }
      }

      function clearSavedPosition() {
        if (!window.localStorage) {
          return;
        }
        try {
          window.localStorage.removeItem(storageKey);
        } catch (error) {
          // Ignore storage errors.
        }
      }

      function restorePosition() {
        if (!window.localStorage || restored) {
          return;
        }
        restored = true;
        try {
          var raw = window.localStorage.getItem(storageKey);
          if (!raw) {
            return;
          }
          var seconds = parseFloat(raw);
          if (!Number.isFinite(seconds) || seconds <= 0) {
            return;
          }
          if (!Number.isFinite(audio.duration) || seconds >= audio.duration - 1) {
            clearSavedPosition();
            return;
          }
          audio.currentTime = seconds;
          setStatus('Audio listo. Retoma desde donde lo dejaste.');
        } catch (error) {
          // Ignore storage/seek errors.
        }
      }

      function getShareUrl() {
        var url = new URL(window.location.href);
        var currentSeconds = Math.max(0, Math.floor(audio.currentTime || 0));
        url.searchParams.set('t', String(currentSeconds));
        return url.toString();
      }

      function applyTimestampFromUrl() {
        try {
          var url = new URL(window.location.href);
          var raw = url.searchParams.get('t');
          if (!raw) {
            return;
          }
          var seconds = parseInt(raw, 10);
          if (!Number.isFinite(seconds) || seconds < 0) {
            return;
          }
          if (Number.isFinite(audio.duration) && seconds >= audio.duration) {
            return;
          }
          audio.currentTime = seconds;
          setStatus('Audio listo en ' + seconds + 's desde enlace compartido.');
        } catch (error) {
          // Ignore URL/seek errors.
        }
      }

      function applyPlaybackRate(rawRate) {
        var rate = parseFloat(rawRate);
        if (!Number.isFinite(rate) || rate <= 0) {
          rate = 1;
        }
        audio.playbackRate = rate;
        if (typeof audio.defaultPlaybackRate === 'number') {
          audio.defaultPlaybackRate = rate;
        }
        if ('preservesPitch' in audio) {
          audio.preservesPitch = true;
        }
        if ('mozPreservesPitch' in audio) {
          audio.mozPreservesPitch = true;
        }
        if ('webkitPreservesPitch' in audio) {
          audio.webkitPreservesPitch = true;
        }
        return rate;
      }

      function restoreRate() {
        if (!rateSelect || !window.localStorage) {
          applyPlaybackRate(rateSelect ? rateSelect.value : 1);
          return;
        }
        try {
          var savedRate = window.localStorage.getItem(rateStorageKey);
          if (!savedRate) {
            applyPlaybackRate(rateSelect.value);
            return;
          }
          var matchingOption = rateSelect.querySelector('option[value="' + savedRate + '"]');
          if (matchingOption) {
            rateSelect.value = savedRate;
          }
          applyPlaybackRate(rateSelect.value);
        } catch (error) {
          applyPlaybackRate(rateSelect.value);
        }
      }

      audio.addEventListener('play', function () {
        setStatus('Reproduciendo audio del artículo.');
      });

      audio.addEventListener('pause', function () {
        savePosition();
        if (!audio.ended) {
          setStatus('Audio en pausa.');
        }
      });

      audio.addEventListener('ended', function () {
        clearSavedPosition();
        if (continuousToggle && continuousToggle.checked && nextEpisodeUrl) {
          rememberNextAutoplayIntent();
          setStatus('Episodio finalizado. Reproducción continua al siguiente episodio.');
          window.setTimeout(function () {
            window.location.href = nextEpisodeUrl;
          }, 600);
          return;
        }
        setStatus('Audio finalizado.');
      });

      audio.addEventListener('timeupdate', savePosition);
      audio.addEventListener('loadedmetadata', restorePosition);
      audio.addEventListener('loadedmetadata', applyTimestampFromUrl);
      window.addEventListener('beforeunload', savePosition);

      if (rateSelect) {
        rateSelect.addEventListener('change', function () {
          var rate = applyPlaybackRate(rateSelect.value);
          if (window.localStorage) {
            try {
              window.localStorage.setItem(rateStorageKey, String(rate));
            } catch (error) {
              // Ignore storage errors.
            }
          }
          setStatus('Velocidad: ' + rate + 'x.');
        });
      }

      restoreRate();

      if (continuousToggle) {
        if (!nextEpisodeUrl) {
          continuousToggle.disabled = true;
          continuousToggle.checked = false;
        } else {
          if (window.localStorage) {
            try {
              continuousToggle.checked = window.localStorage.getItem(continuousStorageKey) === 'true';
            } catch (error) {
              // Ignore storage errors.
            }
          }
          continuousToggle.addEventListener('change', function () {
            if (window.localStorage) {
              try {
                window.localStorage.setItem(continuousStorageKey, continuousToggle.checked ? 'true' : 'false');
              } catch (error) {
                // Ignore storage errors.
              }
            }
            if (continuousToggle.checked && nextEpisodeUrl) {
              if (nextEpisodeTitle) {
                setStatus('Reproducción continua activada. Siguiente: ' + nextEpisodeTitle + '.');
              } else {
                setStatus('Reproducción continua activada.');
              }
              return;
            }
            setStatus('Reproducción continua desactivada.');
          });
        }
      }

      if (shareBtn) {
        shareBtn.addEventListener('click', async function () {
          var shareUrl = getShareUrl();
          try {
            if (navigator.share) {
              await navigator.share({
                title: document.title,
                text: 'Escucha este momento',
                url: shareUrl
              });
              setStatus('Enlace compartido con timestamp.');
              return;
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(shareUrl);
              setStatus('Enlace copiado con timestamp.');
              return;
            }

            // Fallback para escritorio: mostrar un cuadro de diálogo con el enlace
            const fallbackPrompt = window.prompt('Copia este enlace:', shareUrl);
            if (fallbackPrompt !== null) {
              setStatus('Enlace mostrado para copiar manualmente.');
            } else {
              setStatus('No se pudo compartir automáticamente. Copia esta URL: ' + shareUrl);
            }
          } catch (error) {
            if (error && error.name === 'AbortError') {
              return;
            }
            setStatus('No se pudo compartir. Copia esta URL: ' + shareUrl);
          }
        });
      }

      var shouldAutoplayAfterNavigation = consumeAutoplayIntentForCurrentPage();
      if (shouldAutoplayAfterNavigation) {
        setStatus('Cargando siguiente audio...');
        if (audio.readyState >= 2) {
          tryAutoplayAfterNavigation();
        } else {
          audio.addEventListener('canplay', tryAutoplayAfterNavigation, { once: true });
        }
        return;
      }

      setStatus('Audio listo. Pulsa reproducir para iniciar.');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPostAudioPlayer);
      return;
    }

    initPostAudioPlayer();
  })();
</script>
