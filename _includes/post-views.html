{% assign goatcounter_code = site.goatcounter.code | default: '' | strip %}

{% if goatcounter_code != '' %}
<script>
  (function () {
    function initGoatCounter() {
      if (window.goatcounter && typeof window.goatcounter.count === 'function') {
        return;
      }

      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://gc.zgo.at/count.js';
      script.setAttribute('data-goatcounter', 'https://{{ goatcounter_code }}.goatcounter.com/count');
      document.head.appendChild(script);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGoatCounter);
      return;
    }

    initGoatCounter();
  })();
</script>
{% endif %}
