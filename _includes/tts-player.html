<div class="tts-player" data-tts-player>
  <p class="tts-status" data-tts-status role="status" aria-live="polite">Lector de audio listo.</p>

  <div class="tts-controls" data-tts-controls>
    <button type="button" data-tts-action="play">Leer</button>
    <button type="button" data-tts-action="pause" disabled>Pausa</button>
    <button type="button" data-tts-action="resume" disabled>Reanudar</button>
    <button type="button" data-tts-action="stop" disabled>Parar</button>

    <label class="tts-voice-label" for="tts-voice-{{ page.url | slugify }}">Voz</label>
    <select id="tts-voice-{{ page.url | slugify }}" data-tts-voice aria-label="Seleccionar voz"></select>

    <label class="tts-gender-label" for="tts-gender-{{ page.url | slugify }}">Género</label>
    <select id="tts-gender-{{ page.url | slugify }}" data-tts-gender aria-label="Seleccionar género de voz">
      <option value="any">Automático</option>
      <option value="female">Femenina</option>
      <option value="male">Masculina</option>
    </select>

    <label class="tts-rate-label" for="tts-rate-{{ page.url | slugify }}">Velocidad</label>
    <input
      id="tts-rate-{{ page.url | slugify }}"
      type="range"
      min="0.8"
      max="1.3"
      step="0.1"
      value="1.0"
      data-tts-rate
      aria-label="Velocidad de lectura"
    >
    <output data-tts-rate-value>1.0x</output>

    <label class="tts-pitch-label" for="tts-pitch-{{ page.url | slugify }}">Tono</label>
    <input
      id="tts-pitch-{{ page.url | slugify }}"
      type="range"
      min="0.8"
      max="1.2"
      step="0.1"
      value="1.0"
      data-tts-pitch
      aria-label="Tono de voz"
    >
    <output data-tts-pitch-value>1.0</output>
  </div>
</div>

<style>
  .tts-player {
    margin: 1.5rem 0;
    padding: 1rem;
    border: 1px solid rgba(0, 0, 0, 0.15);
    border-radius: 0.5rem;
    background: rgba(0, 0, 0, 0.02);
  }

  .tts-status {
    margin: 0 0 0.75rem;
    font-size: 0.95rem;
  }

  .tts-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
  }

  .tts-controls button {
    cursor: pointer;
  }

  .tts-rate-label {
    margin-left: 0.25rem;
  }

  .tts-voice-label {
    margin-left: 0.25rem;
  }

  .tts-gender-label {
    margin-left: 0.25rem;
  }

  .tts-controls select {
    max-width: 13rem;
  }

  .tts-controls input[type="range"] {
    width: 8rem;
  }

  .tts-pitch-label {
    margin-left: 0.25rem;
  }
</style>

<script>
  (function () {
    function initTtsPlayer() {
      var root = document.querySelector('[data-tts-player]');
      if (!root) {
        return;
      }

      var statusEl = root.querySelector('[data-tts-status]');
      var controlsEl = root.querySelector('[data-tts-controls]');
      var playBtn = root.querySelector('[data-tts-action="play"]');
      var pauseBtn = root.querySelector('[data-tts-action="pause"]');
      var resumeBtn = root.querySelector('[data-tts-action="resume"]');
      var stopBtn = root.querySelector('[data-tts-action="stop"]');
      var voiceSelect = root.querySelector('[data-tts-voice]');
      var genderSelect = root.querySelector('[data-tts-gender]');
      var rateInput = root.querySelector('[data-tts-rate]');
      var rateValue = root.querySelector('[data-tts-rate-value]');
      var pitchInput = root.querySelector('[data-tts-pitch]');
      var pitchValue = root.querySelector('[data-tts-pitch-value]');
      var synth = window.speechSynthesis;
      var utterance = null;
      var articleText = '';
      var voices = [];
      var selectedVoiceURI = '';
      var preferredLang = 'es-ES';
      var preferredGender = 'any';

      function setStatus(message) {
        if (statusEl) {
          statusEl.textContent = message;
        }
      }

      function setControlsState(state) {
        playBtn.disabled = state.play;
        pauseBtn.disabled = state.pause;
        resumeBtn.disabled = state.resume;
        stopBtn.disabled = state.stop;
      }

      function normalizeLang(lang) {
        return (lang || '').toLowerCase();
      }

      function scoreVoice(voice, targetLang) {
        var score = 0;
        var voiceLang = normalizeLang(voice.lang);
        var voiceName = (voice.name || '').toLowerCase();
        var targetBase = targetLang.split('-')[0];

        if (voiceLang === targetLang) {
          score += 60;
        } else if (voiceLang.indexOf(targetBase) === 0) {
          score += 25;
        }

        if (voice.localService) {
          score += 10;
        }

        if (voice.default) {
          score += 5;
        }

        if (voiceName.indexOf('neural') !== -1 || voiceName.indexOf('natural') !== -1) {
          score += 30;
        }

        if (voiceName.indexOf('google') !== -1 || voiceName.indexOf('microsoft') !== -1) {
          score += 12;
        }

        return score;
      }

      function inferVoiceGender(voice) {
        var name = (voice.name || '').toLowerCase();
        var femaleHints = [
          'female', 'woman', 'mujer', 'femenina', 'carmen', 'elvira', 'laura', 'lucia',
          'maria', 'sofia', 'helena', 'paulina', 'monica'
        ];
        var maleHints = [
          'male', 'man', 'hombre', 'masculina', 'jorge', 'diego', 'carlos', 'enrique',
          'raul', 'javier', 'antonio', 'pablo'
        ];

        for (var i = 0; i < femaleHints.length; i += 1) {
          if (name.indexOf(femaleHints[i]) !== -1) {
            return 'female';
          }
        }

        for (var j = 0; j < maleHints.length; j += 1) {
          if (name.indexOf(maleHints[j]) !== -1) {
            return 'male';
          }
        }

        return 'unknown';
      }

      function getEligibleVoices() {
        var eligible = [];
        for (var i = 0; i < voices.length; i += 1) {
          var voice = voices[i];
          var voiceLang = normalizeLang(voice.lang);
          if (voiceLang.indexOf('es') !== 0) {
            continue;
          }
          if (preferredGender === 'any') {
            eligible.push(voice);
            continue;
          }
          if (inferVoiceGender(voice) === preferredGender) {
            eligible.push(voice);
          }
        }

        if (!eligible.length) {
          for (var j = 0; j < voices.length; j += 1) {
            var fallbackVoice = voices[j];
            if (normalizeLang(fallbackVoice.lang).indexOf('es') === 0) {
              eligible.push(fallbackVoice);
            }
          }
        }

        return eligible.length ? eligible : voices.slice();
      }

      function getPreferredVoice() {
        if (!voices.length) {
          return null;
        }
        var pool = getEligibleVoices();
        if (!pool.length) {
          return null;
        }

        if (selectedVoiceURI) {
          for (var i = 0; i < pool.length; i += 1) {
            if (pool[i].voiceURI === selectedVoiceURI) {
              return pool[i];
            }
          }
        }

        var targetLang = normalizeLang(preferredLang);
        var best = pool[0];
        var bestScore = scoreVoice(best, targetLang);

        for (var j = 1; j < pool.length; j += 1) {
          var currentScore = scoreVoice(pool[j], targetLang);
          if (currentScore > bestScore) {
            best = pool[j];
            bestScore = currentScore;
          }
        }

        selectedVoiceURI = best.voiceURI || '';
        return best;
      }

      function populateVoices() {
        voices = synth.getVoices() || [];
        if (!voiceSelect) {
          return;
        }

        voiceSelect.innerHTML = '';
        if (!voices.length) {
          var opt = document.createElement('option');
          opt.value = '';
          opt.textContent = 'Voz por defecto';
          voiceSelect.appendChild(opt);
          voiceSelect.disabled = true;
          return;
        }

        voiceSelect.disabled = false;
        var preferred = getPreferredVoice();
        var renderVoices = getEligibleVoices();

        for (var i = 0; i < renderVoices.length; i += 1) {
          var voice = renderVoices[i];
          var option = document.createElement('option');
          option.value = voice.voiceURI || '';
          option.textContent = voice.name + ' (' + voice.lang + ')';
          if (preferred && preferred.voiceURI === voice.voiceURI) {
            option.selected = true;
          }
          voiceSelect.appendChild(option);
        }
      }

      function getContentText() {
        var selectors = ['article', '.post-content', '.post', 'main'];
        var target = null;

        for (var i = 0; i < selectors.length; i += 1) {
          target = document.querySelector(selectors[i]);
          if (target) {
            break;
          }
        }

        if (!target) {
          return '';
        }

        var clone = target.cloneNode(true);
        var removable = clone.querySelectorAll('script, style, nav, footer, header, aside, .toc, .comments, .share, .related, [data-tts-player]');
        removable.forEach(function (node) {
          node.remove();
        });

        return (clone.innerText || '')
          .replace(/\u00a0/g, ' ')
          .replace(/[ \t]+/g, ' ')
          .replace(/\n{2,}/g, '\n')
          .replace(/\s*\n\s*/g, '\n')
          .trim();
      }

      function cleanupSpeech() {
        if (synth.speaking || synth.pending) {
          synth.cancel();
        }
        utterance = null;
        setControlsState({ play: false, pause: true, resume: true, stop: true });
      }

      function speakText() {
        articleText = getContentText();
        if (!articleText) {
          setStatus('No se encontró contenido legible para este artículo.');
          setControlsState({ play: false, pause: true, resume: true, stop: true });
          return;
        }

        cleanupSpeech();

        utterance = new SpeechSynthesisUtterance(articleText);
        utterance.lang = preferredLang;
        utterance.rate = parseFloat(rateInput.value);
        utterance.pitch = parseFloat(pitchInput.value);
        utterance.voice = getPreferredVoice();

        utterance.onstart = function () {
          setStatus('Leyendo artículo...');
          setControlsState({ play: true, pause: false, resume: true, stop: false });
        };

        utterance.onpause = function () {
          setStatus('Lectura en pausa.');
          setControlsState({ play: true, pause: true, resume: false, stop: false });
        };

        utterance.onresume = function () {
          setStatus('Lectura reanudada.');
          setControlsState({ play: true, pause: false, resume: true, stop: false });
        };

        utterance.onend = function () {
          setStatus('Lectura terminada.');
          setControlsState({ play: false, pause: true, resume: true, stop: true });
        };

        utterance.onerror = function () {
          setStatus('No se pudo reproducir el audio en este navegador.');
          setControlsState({ play: false, pause: true, resume: true, stop: true });
        };

        synth.speak(utterance);
      }

      if (!('speechSynthesis' in window) || typeof window.SpeechSynthesisUtterance === 'undefined') {
        setStatus('Tu navegador no soporta lectura en voz alta (TTS).');
        if (controlsEl) {
          controlsEl.hidden = true;
        }
        return;
      }

      articleText = getContentText();
      if (!articleText) {
        setStatus('No se encontró contenido legible para este artículo.');
        setControlsState({ play: true, pause: true, resume: true, stop: true });
        return;
      }

      setControlsState({ play: false, pause: true, resume: true, stop: true });
      populateVoices();

      playBtn.addEventListener('click', function () {
        speakText();
      });

      pauseBtn.addEventListener('click', function () {
        if (synth.speaking && !synth.paused) {
          synth.pause();
          setStatus('Lectura en pausa.');
          setControlsState({ play: true, pause: true, resume: false, stop: false });
        }
      });

      resumeBtn.addEventListener('click', function () {
        if (synth.speaking && synth.paused) {
          synth.resume();
          setStatus('Lectura reanudada.');
          setControlsState({ play: true, pause: false, resume: true, stop: false });
        }
      });

      stopBtn.addEventListener('click', function () {
        cleanupSpeech();
        setStatus('Lectura detenida.');
      });

      rateInput.addEventListener('input', function () {
        var value = parseFloat(rateInput.value).toFixed(1);
        rateValue.value = value + 'x';
      });

      rateInput.addEventListener('change', function () {
        if (synth.speaking) {
          speakText();
        }
      });

      pitchInput.addEventListener('input', function () {
        pitchValue.value = parseFloat(pitchInput.value).toFixed(1);
      });

      pitchInput.addEventListener('change', function () {
        if (synth.speaking) {
          speakText();
        }
      });

      voiceSelect.addEventListener('change', function () {
        selectedVoiceURI = voiceSelect.value;
        if (synth.speaking) {
          speakText();
        }
      });

      genderSelect.addEventListener('change', function () {
        preferredGender = genderSelect.value;
        selectedVoiceURI = '';
        populateVoices();
        if (synth.speaking) {
          speakText();
        }
      });

      synth.onvoiceschanged = function () {
        populateVoices();
      };

      window.addEventListener('beforeunload', function () {
        cleanupSpeech();
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initTtsPlayer);
      return;
    }

    initTtsPlayer();
  })();
</script>
