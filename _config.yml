title: Daizan Soriano
description: Un blog sobre práctica, vida y dharma
url: https://daizansoriano.com
baseurl: ""
lang: es
image: /assets/logo.png
markdown: kramdown
kramdown:
  input: GFM
permalink: /:title/
collections:
  podcast:
    output: true
    permalink: /:title/
  xinxinming:
    output: true
    permalink: /xin-xin-ming/:name/
podcast_meta:
  author: Daizan Soriano
  owner_name: Daizan Soriano
  owner_email: daizansoriano@caminomedio.org
  image: /assets/podcast-cover-3000.jpg
  category: Religion & Spirituality
  subcategory: Religion
  explicit: false
timezone: UTC
pwa_sw_version: v0.5.2
goatcounter:
  code: "daizansoriano"
plugins:
  - jekyll-feed
  - jekyll-seo-tag
sass:
  style: compressed
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: ""
  - scope:
      path: ""
      type: podcast
    values:
      layout: podcast
      image: /assets/logo.png
  - scope:
      path: ""
      type: xinxinming
    values:
      layout: xxm-section
